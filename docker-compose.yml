version: "3.8"

services:
  walkcheck:
    image: nginx:alpine
    container_name: walkcheck
    restart: unless-stopped
    ports:
      - "8765:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "com.walkcheck.description=Morning walk Go/No-Go dashboard"
